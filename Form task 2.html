<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table cellpadding="10" cellspacing="0" align="center" style="background-color: blanchedalmond;">
        <form>
            <tr>
                <th colspan="2"><u>Registration Form</u></th>
            </tr>

            <tr>
                <td>First name :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Last name :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>e-mail :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Password :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" value="1" name="">Male
                    <input type="radio" value="1" name="">Female
                    <input type="radio" value="1" name="">Others
                </td>
            </tr>

            <tr>
                <td>Mobile :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea style="width: 165px; height: 60px"></textarea>
                </td>
            </tr>

            <tr align="center">
                <td colspan="2">
                    <input type="reset">
                    <input type="submit">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
