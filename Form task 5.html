<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="font-size: 25px;">Basic form design using HTML</h1>
    <fieldset style="padding: 10px;">
        <legend><b>Personal Details</b></legend>
        <form>
            <label>First name :</label>
            <input type="text"> <br><br>

            <label>Last name :</label>
            <input type="text"> <br><br>

            <label>Gender :</label>
            <input type="radio" value="1" name="0">Male
            <input type="radio" value="1" name="0">Female <br><br>

            <label>Email :</label>
            <input type="text"> <br><br>

            <label>Date of birth :</label>
            <input type="date"> <br><br>

            <label>Address :</label> <br><br>
            <textarea style="width: 200px; height: 50px;"></textarea> <br>

            <button type="submit" style="border-radius: 10%;">Submit</button>
        </form>
    </fieldset>
</body>
</html>
