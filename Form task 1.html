<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellspacing="1" cellpadding="5">
        <form>
            <tr align="content">
                <th>Name</th>
                <th>Value</th>
            </tr>

            <tr>   
                <td><label>Name</label></td>
                <td><input type="text" placeholder="Enter your name" style="border-block-end: 1px;"></td>
            </tr>

            <tr>
                <td><label>Sex</label></td>
                <td><input type="radio" value="1" name="0">Male <br>
                    <input type="radio" value="1" name="0">Female
                </td>
            </tr>

            <tr>
                <td>Eye color</td>
                <td>
                    <select>
                        <option>Black</option>
                        <option>Blue</option>
                        <option>Brown</option>
                        <option>Red</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Check all that apply</td>
                <td>
                    <input type="checkbox">Over 6 feet tall <br>
                    <input type="checkbox">Over 200 pounds
                </td>
            </tr>

            <tr>
                <td colspan="2">Describe your athletic ability: <br>
                    <textarea style="width: 300px; height: 80px"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                <button type="submit">Enter my information</button>
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
