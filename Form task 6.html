<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset style="border-color: blue;">
        <form>
            <h2 style="color: blue;">Please complete our survey</h2>
            <table cellpadding="3" cellspacing="3">
                <tr>
                    <td colspan="2"><b>Contact information</b></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Email address :</label></td>
                    <td><input type="text" size="20"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>First name :</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Last name :</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td colspan="2"><b>Geographic information</b></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>State :</label></td>
                    <td><input type="text" placeholder="Two character"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Zipcode :</label></td>
                    <td><input type="text" placeholder="Five digits"></td>                
                </tr>

                <tr>
                    <td colspan="2"><b>How did you hear about us?</b></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Web search :</label></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Facebook :</label></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Web search :</label></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Twitter :</label></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr style="color: blue;">
                    <td><label>Email message :</label></td>
                    <td><input type="checkbox"></td>
                </tr>

                <tr>
                    <td colspan="2"><b>Thank you for taking our survey!</b></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                    <button type="reset" style="border-inline-start: 0px; border-radius: 10%">Reset</button>
                    <button type="submit" style="border-inline-start: 0px; border-radius: 10%">Submit</button>
                </tr>
            </table>
        </form>
    </fieldset>
</body>
</html>
