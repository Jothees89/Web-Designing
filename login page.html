<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login page.css">
</head>
<body>
    <form>
        <div class="login">
            <div class="log">
                <div class="img">
                    <img src="login icon.png" title="login icon" width="70px"> <br><br>
                </div>
                <h1 class="head"><b>Welcome to login</b></h1> <br>

                <label class="name">User name</label> <br>
                <input type="text" placeholder="enter your username"> <br><br>
                <label class="pw">Password</label> <br>
                <input type="text" placeholder="enter your password"> <br><br>
                <label class="dob">Date of birth</label> <br>
                <input type="text" placeholder="enter your DoB"> <br><br>
                <label class="email">Email</label> <br>
                <input type="text" placeholder="enter your email"> <br><br><br>
                <button type="submit">Login</button>
            </div>
        </div>
    </form>
</body>
</html>
